<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Predictor - Round 1 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0f;--surface:#12121a;--card:#181825;--border:#2a2a3d;--borderHi:#3d3d5c;
--accent:#22d3ee;--accentDim:rgba(34,211,238,0.12);--accentGlow:rgba(34,211,238,0.25);
--green:#34d399;--greenDim:rgba(52,211,153,0.12);--amber:#fbbf24;--amberDim:rgba(251,191,36,0.12);
--rose:#fb7185;--text:#e2e8f0;--textDim:#94a3b8;--textMuted:#64748b;
--font:'Fira Code','JetBrains Mono',monospace;--fontSans:'DM Sans','Segoe UI',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--fontSans);min-height:100vh;padding-bottom:60px}
.glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,var(--accentGlow) 0%,transparent 70%);opacity:.15;pointer-events:none;z-index:0}
.header{position:relative;z-index:1;text-align:center;padding:40px 20px 20px}
.header h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px;background:linear-gradient(135deg,var(--text) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--textMuted);font-size:13px}
.container{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.field label{display:block;font-size:11px;color:var(--textMuted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;font-family:var(--fontSans)}
.field input,.field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:18px;font-family:var(--font);font-weight:600;outline:none;transition:border-color .2s}
.field select{font-size:13px;padding:10px 12px;cursor:pointer;appearance:auto}
.field input:focus,.field select:focus{border-color:var(--accent)}
.rank-display{background:var(--accentDim);border:1px solid rgba(34,211,238,0.2);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.rank-display .lbl{color:var(--textDim);font-size:13px}
.rank-display .val{color:var(--accent);font-size:22px;font-family:var(--font);font-weight:700}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.btn-row{display:flex;gap:12px}
.btn-primary{flex:1;padding:14px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#06b6d4);color:#0a0a0f;font-size:14px;font-weight:700;font-family:var(--fontSans);letter-spacing:.5px;transition:all .2s;box-shadow:0 4px 20px var(--accentGlow)}
.btn-primary:disabled{background:var(--border);color:var(--textMuted);cursor:not-allowed;opacity:.5;box-shadow:none}
.btn-reset{padding:14px 24px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--textDim);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--fontSans);transition:all .2s}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.results-header .count{font-size:20px;font-weight:700}
.results-header .info{color:var(--textMuted);font-size:13px}
.sort-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--textMuted);font-size:11px;cursor:pointer;font-family:var(--fontSans);font-weight:500;transition:all .15s}
.sort-btn.active{border-color:var(--accent);background:var(--accentDim);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .2s;margin-bottom:8px}
.card:hover{border-color:var(--borderHi)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-branch{font-size:12px;color:var(--accent);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-rank-label{font-size:11px;color:var(--textMuted);text-align:right}
.card-rank-val{font-size:18px;font-family:var(--font);font-weight:700;color:var(--green);text-align:right}
.card-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:rgba(148,163,184,0.1);color:var(--textDim)}
.tag-govt{background:var(--greenDim);color:var(--green);font-weight:600}
.tag-gia{background:var(--accentDim);color:var(--accent);font-weight:600}
.tag-sf{background:var(--amberDim);color:var(--amber);font-weight:600}
.tag-pvt{background:rgba(251,113,133,0.12);color:var(--rose);font-weight:600}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
.pagination button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;font-family:var(--fontSans)}
.pagination button:disabled{background:var(--card);color:var(--textMuted);cursor:not-allowed}
.pagination span{font-size:12px;color:var(--textDim);font-family:var(--font)}
.footer{text-align:center;margin-top:24px;padding:16px;border-top:1px solid var(--border)}
.footer p{color:var(--textMuted);font-size:11px;line-height:1.6}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center}
.empty .icon{font-size:40px;margin-bottom:12px}
.empty .msg{color:var(--textDim);font-size:14px}
.empty .sub{color:var(--textMuted);font-size:12px;margin-top:4px}
.hidden{display:none}
.ms-wrap{position:relative}
.ms-btn{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:border-color .2s;min-height:40px}
.ms-btn:focus,.ms-btn.open{border-color:var(--accent)}
.ms-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ms-arrow{font-size:10px;color:var(--textMuted);flex-shrink:0}
.ms-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:240px;overflow-y:auto;z-index:100;padding:6px 0}
.ms-drop.show{display:block}
.ms-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--textDim);transition:background .12s}
.ms-item:hover{background:rgba(148,163,184,0.08)}
.ms-item.checked{color:var(--accent)}
.ms-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:all .15s}
.ms-item.checked .ms-check{border-color:var(--accent);background:var(--accentDim);color:var(--accent)}
.ms-count{background:var(--accentDim);color:var(--accent);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;flex-shrink:0}
</style>
</head>
<body>
<div class="glow"></div>

<div class="header">
  <h1>College Predictor - Round 1, 2026</h1>
  <p>Enter your ACPC merit rank to find where you can get admission</p>
</div>

<div class="container">
  <div class="panel">
    <div style="margin-bottom:20px">
      <div class="field">
        <label>ACPC Merit Rank</label>
        <input type="number" id="meritInput" min="1" max="100000" step="1" placeholder="e.g. 5000">
      </div>
    </div>

    <div class="filter-grid">
      <div class="field"><label>Category</label><select id="fCategory"></select></div>
      <div class="field"><label>City</label><select id="fCity"></select></div>
      <div class="field"><label>Branch Group</label><div class="ms-wrap" id="branchMsWrap"><button type="button" class="ms-btn" id="branchMsBtn"><span class="ms-label">All Branches</span><span class="ms-arrow">▼</span></button><div class="ms-drop" id="branchMsDrop"></div></div></div>
      <div class="field"><label>Institute Type</label><select id="fInstType"></select></div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btnSearch" disabled>FIND COLLEGES</button>
      <button class="btn-reset" id="btnReset">Reset</button>
    </div>
  </div>
</div>

<div class="container" id="resultsSection" style="margin-top:24px;display:none">
  <div class="results-header">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="count" id="resCount">0</span>
      <span class="info" id="resInfo">colleges found</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;color:var(--textMuted)">Sort:</span>
      <button class="sort-btn active" data-sort="rank">Rank</button>
      <button class="sort-btn" data-sort="college">College</button>
      <button class="sort-btn" data-sort="branch">Branch</button>
    </div>
  </div>

  <div id="cardsList"></div>

  <div class="pagination" id="paginationBox">
    <button id="btnPrev">Prev</button>
    <span id="pageInfo">1 / 1</span>
    <button id="btnNext">Next</button>
  </div>

  <div class="footer">
    <p>Based on ACPC Round 1 (2026-27) closing ranks data. Results include a 10% margin on closing ranks. Actual cutoffs may vary. Use for guidance only.</p>
  </div>
</div>

// ── Constants ──
const MARGIN = 0.10, PER_PAGE = 25;
const CATEGORIES = ["All","GEN","EWS","SEBC","SC","ST","TFWS","ESM","GEN-PH","EWS-PH","SC-PH","SEBC-PH","ST-PH"];
const INST_TYPES = ["All","Govt/GIA","SFI","AUTO"];
const CITIES = ["All","Ahmedabad","Gandhinagar","Vadodara","Surat","Rajkot","Bhavnagar","V.V.Nagar","Changa","Nadiad","Bharuch","Mehsana","Bardoli","Karamsad","Valsad","Modasa","Dahod","Navsari","Patan","Anand","Morbi","Palanpur","Junagadh","Visnagar","Kadi","Bhuj","Godhara","Kalol","Vapi","Mahuva","Wadhvan","Kheda","Botad","Kosamba","Vasad","Porbandar","Jamnagar","Himmatnagar","Mandvi","Other"];
const BRANCH_GROUPS = [
  {label:"Computer / IT",keys:["COMPUTER","INFORMATION TECHNOLOGY","CYBER","DATA SCIENCE","BIG DATA","CLOUD","INTERNET OF THINGS"]},
  {label:"ICT",keys:["ICT"]},
  {label:"AI / ML / DS",keys:["ARTIFICIAL INTELLIGENCE","MACHINE LEARNING","MATHEMATICS AND COMPUTING"]},
  {label:"Electronics / EC",keys:["ELECTRONICS","VLSI","INSTRUMENTATION"]},
  {label:"Electrical",keys:["ELECTRICAL","POWER ELECTRONICS"]},
  {label:"Mechanical",keys:["MECHANICAL","MECHATRONICS","PRODUCTION","ROBOTICS"]},
  {label:"Automobile",keys:["AUTOMOBILE"]},
  {label:"Aeronautical / Aerospace",keys:["AERONAUTICAL","AERO SPACE"]},
  {label:"Civil",keys:["CIVIL","IRRIGATION"]},
  {label:"Environmental",keys:["ENVIRONMENTAL","CLIMATE","ENVIRONMENT"]},
  {label:"Chemical",keys:["CHEMICAL"]},
  {label:"Biomedical / Biotech",keys:["BIOMEDICAL","BIOTECHNOLOGY","BIOINFORMATICS","PHARMACEUTICAL","BIOSCIENCES"]},
  {label:"Other",keys:[]}
];

function getBG(b){const u=b.toUpperCase();for(const g of BRANCH_GROUPS){if(!g.keys.length)continue;if(g.keys.some(k=>u.includes(k)))return g.label}return"Other"}
function instTag(t){const m={"Govt/GIA":"tag-govt",SFI:"tag-sf",AUTO:"tag-gia"};return m[t]||"tag-pvt"}

// ── DOM ──
const $=id=>document.getElementById(id);
const meritEl=$("meritInput");
const btnSearch=$("btnSearch"),btnReset=$("btnReset"),resultsSection=$("resultsSection");
const resCount=$("resCount"),resInfo=$("resInfo"),cardsList=$("cardsList");
const pageInfo=$("pageInfo"),btnPrev=$("btnPrev"),btnNext=$("btnNext"),paginationBox=$("paginationBox");
const fCat=$("fCategory"),fCity=$("fCity"),fInst=$("fInstType");
const branchMsBtn=$("branchMsBtn"),branchMsDrop=$("branchMsDrop"),branchMsLabel=branchMsBtn.querySelector(".ms-label");

// populate selects
function fillSel(el,opts){opts.forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;el.appendChild(op)})}
fillSel(fCat,CATEGORIES);fillSel(fCity,CITIES);fillSel(fInst,INST_TYPES);

// multi-select for branches
let selectedBranches=new Set();
const branchLabels=BRANCH_GROUPS.map(g=>g.label);

function buildBranchMs(){
  branchMsDrop.innerHTML="";
  branchLabels.forEach(label=>{
    const item=document.createElement("div");
    item.className="ms-item"+(selectedBranches.has(label)?" checked":"");
    item.innerHTML=`<span class="ms-check">${selectedBranches.has(label)?"✓":""}</span><span>${label}</span>`;
    item.addEventListener("click",e=>{
      e.stopPropagation();
      if(selectedBranches.has(label))selectedBranches.delete(label);else selectedBranches.add(label);
      buildBranchMs();updateBranchLabel();
      if(results.length||resultsSection.style.display==="block"){page=0;doSearch()}
    });
    branchMsDrop.appendChild(item);
  });
}

function updateBranchLabel(){
  if(selectedBranches.size===0){branchMsLabel.textContent="All Branches";branchMsBtn.querySelector(".ms-count")?.remove()}
  else{
    const names=[...selectedBranches];
    branchMsLabel.textContent=names.length<=2?names.join(", "):names.slice(0,2).join(", ")+" +"+( names.length-2);
    let cnt=branchMsBtn.querySelector(".ms-count");
    if(!cnt){cnt=document.createElement("span");cnt.className="ms-count";branchMsBtn.insertBefore(cnt,branchMsBtn.querySelector(".ms-arrow"))}
    cnt.textContent=selectedBranches.size;
  }
}

branchMsBtn.addEventListener("click",e=>{
  e.stopPropagation();
  const open=branchMsDrop.classList.toggle("show");
  branchMsBtn.classList.toggle("open",open);
});
document.addEventListener("click",()=>{branchMsDrop.classList.remove("show");branchMsBtn.classList.remove("open")});
branchMsDrop.addEventListener("click",e=>e.stopPropagation());
buildBranchMs();

let meritRank=null, results=[], page=0, sortBy="rank";

function calcRank(){
  const v=parseInt(meritEl.value);
  if(isNaN(v)||v<1){meritRank=null;btnSearch.disabled=true;return}
  meritRank=v;
  btnSearch.disabled=false;
}

function doSearch(){
  if(meritRank===null)return;
  const cat=fCat.value,city=fCity.value,it=fInst.value;
  let f=RAW.filter(d=>d.r>=meritRank*(1-MARGIN));
  if(cat!=="All")f=f.filter(d=>d.c===cat);
  if(city!=="All")f=f.filter(d=>d.y===city);
  if(it!=="All")f=f.filter(d=>d.t===it);
  if(selectedBranches.size>0)f=f.filter(d=>selectedBranches.has(getBG(d.b)));
  if(sortBy==="rank")f.sort((a,b)=>a.r-b.r);
  else if(sortBy==="college")f.sort((a,b)=>a.i.localeCompare(b.i));
  else f.sort((a,b)=>a.b.localeCompare(b.b));
  results=f;page=0;
  renderResults();
}

function renderResults(){
  resultsSection.style.display="block";
  resCount.textContent=results.length;
  resInfo.textContent="colleges found for rank #"+meritRank.toLocaleString();
  const totalPages=Math.ceil(results.length/PER_PAGE)||1;
  const slice=results.slice(page*PER_PAGE,(page+1)*PER_PAGE);

  if(results.length===0){
    cardsList.innerHTML='<div class="empty"><div class="icon">🎓</div><p class="msg">No colleges found with current filters.</p><p class="sub">Try adjusting your filters or check your percentile values.</p></div>';
    paginationBox.style.display="none";return;
  }

  let html="";
  slice.forEach(d=>{
    html+=`<div class="card"><div class="card-top"><div style="flex:1;min-width:0"><div class="card-name">${esc(d.i)}</div><div class="card-branch">${esc(d.b)}</div></div><div style="flex-shrink:0"><div class="card-rank-label">Closing Rank</div><div class="card-rank-val">#${d.r.toLocaleString()}</div></div></div><div class="card-tags"><span class="tag ${instTag(d.t)}">${esc(d.t)}</span><span class="tag">${esc(d.c)}</span><span class="tag">${esc(d.y)}</span></div></div>`;
  });
  cardsList.innerHTML=html;

  if(totalPages>1){paginationBox.style.display="flex";pageInfo.textContent=(page+1)+" / "+totalPages;btnPrev.disabled=page===0;btnNext.disabled=page>=totalPages-1}
  else paginationBox.style.display="none";
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

meritEl.addEventListener("input",calcRank);
meritEl.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
btnSearch.addEventListener("click",doSearch);
[fCat,fCity,fInst].forEach(el=>el.addEventListener("change",()=>{if(results.length||resultsSection.style.display==="block"){page=0;doSearch()}}));

btnReset.addEventListener("click",()=>{
  meritEl.value="";fCat.value="All";fCity.value="All";fInst.value="All";
  selectedBranches.clear();buildBranchMs();updateBranchLabel();
  meritRank=null;results=[];page=0;sortBy="rank";
  btnSearch.disabled=true;resultsSection.style.display="none";
  document.querySelectorAll(".sort-btn").forEach(b=>{b.classList.toggle("active",b.dataset.sort==="rank")});
});

document.querySelectorAll(".sort-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    sortBy=btn.dataset.sort;
    document.querySelectorAll(".sort-btn").forEach(b=>b.classList.toggle("active",b===btn));
    if(results.length){page=0;doSearch()}
  });
});

btnPrev.addEventListener("click",()=>{if(page>0){page--;renderResults();window.scrollTo({top:resultsSection.offsetTop-20,behavior:"smooth"})}});
btnNext.addEventListener("click",()=>{const tp=Math.ceil(results.length/PER_PAGE);if(page<tp-1){page++;renderResults();window.scrollTo({top:resultsSection.offsetTop-20,behavior:"smooth"})}});
</script>
